[project]
name = "smartsched-ulima-web-agent-backend"
version = "0.1.0"
description = "Backend FastAPI para Smartsched Ulima — orquesta el agente RAG y persiste estado en Postgres/Cloud SQL"
authors = [
    {name = "Carlos Escobar", email = "carlos.escobar.arroyo@gmail.com"},
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "google-cloud-vision>=3.8.0",
    "google-cloud-storage>=3.10.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    # Agente IA (US-12): proyecto ADK embebido, corre in-process en el backend.
    "ulima-agent",
    # Email (US-25): se usa smtplib de la stdlib (SMTP de Gmail). Sin dependencias extra.
]

[tool.uv.sources]
ulima-agent = { path = "ulima-agent", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Template HTML embebido del correo de reset: líneas largas inevitables.
"app/integrations/email/client.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Librerías de auth sin stubs de tipos (US-24).
module = ["jose.*"]
ignore_missing_imports = true
